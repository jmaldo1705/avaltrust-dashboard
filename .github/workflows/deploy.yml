name: Deploy AvalTrust Dashboard to S3 + CloudFront

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  S3_BUCKET: avaltrust-prod-dashboard-16e2397d
  CLOUDFRONT_DISTRIBUTION_ID: E2OPTGSEWAFZG4

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463470985447:role/avaltrust-dashboard-github-actions-deploy
          role-session-name: avaltrust-dashboard-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed build assets
        run: |
          aws s3 sync dist/avaltrust-dashboard/browser/ s3://$S3_BUCKET/ \
            --delete \
            --exclude "index.html" \
            --exclude "favicon.png" \
            --exclude "assets/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload mutable static assets
        run: |
          aws s3 sync dist/avaltrust-dashboard/browser/assets/ s3://$S3_BUCKET/assets/ \
            --delete \
            --cache-control "public,max-age=3600,must-revalidate"
          aws s3 cp dist/avaltrust-dashboard/browser/favicon.png s3://$S3_BUCKET/favicon.png \
            --cache-control "public,max-age=3600,must-revalidate" \
            --content-type "image/png"

      - name: Upload app shell without browser cache
        run: |
          aws s3 cp dist/avaltrust-dashboard/browser/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
