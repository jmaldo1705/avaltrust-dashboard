name: Deploy AvalTrust landing to S3 + CloudFront

on:
  push:
    branches: [master]
    paths:
      - 'projects/landing/**'
      - 'projects/shared-ui/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  S3_BUCKET: avaltrust-prod-site-16e2397d
  CLOUDFRONT_DISTRIBUTION_ID: E1W7CUDMJQGLSZ

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Prerenderiza cada ruta a su propio index.html: no hay servidor Node
      # en produccion, solo archivos estaticos.
      - name: Build
        run: npm run build:landing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463470985447:role/avaltrust-site-github-actions-deploy
          role-session-name: avaltrust-landing-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Los bundles llevan hash en el nombre, asi que pueden cachearse para
      # siempre: un cambio genera un nombre distinto.
      - name: Upload hashed build assets
        run: |
          aws s3 sync dist/landing/browser/ "s3://$S3_BUCKET/" \
            --delete \
            --exclude "*.html" \
            --exclude "img/*" \
            --exclude "image/*" \
            --exclude "favicon.png" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload mutable static assets
        run: |
          aws s3 sync dist/landing/browser/img/ "s3://$S3_BUCKET/img/" \
            --delete \
            --cache-control "public,max-age=86400,must-revalidate"
          aws s3 sync dist/landing/browser/image/ "s3://$S3_BUCKET/image/" \
            --delete \
            --cache-control "public,max-age=86400,must-revalidate"
          aws s3 cp dist/landing/browser/favicon.png "s3://$S3_BUCKET/favicon.png" \
            --cache-control "public,max-age=86400,must-revalidate" \
            --content-type "image/png"
          aws s3 cp dist/landing/browser/robots.txt "s3://$S3_BUCKET/robots.txt" \
            --cache-control "public,max-age=3600,must-revalidate" \
            --content-type "text/plain; charset=utf-8"
          aws s3 cp dist/landing/browser/sitemap.xml "s3://$S3_BUCKET/sitemap.xml" \
            --cache-control "public,max-age=3600,must-revalidate" \
            --content-type "application/xml; charset=utf-8"

      # El HTML prerenderizado no se cachea en el navegador para que un
      # despliegue se vea de inmediato. index.csr.html no se publica: es el
      # esqueleto sin prerenderizar y ninguna ruta lo referencia.
      - name: Upload prerendered HTML without browser cache
        run: |
          aws s3 cp dist/landing/browser/ "s3://$S3_BUCKET/" \
            --recursive \
            --exclude "*" --include "*.html" --exclude "index.csr.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
