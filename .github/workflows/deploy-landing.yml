name: Deploy AvalTrust landing to Firebase Hosting

on:
  push:
    branches: [master]
    paths:
      - 'projects/landing/**'
      - 'projects/shared-ui/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/landing-404.mjs'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch: {}

# Dos despliegues seguidos del mismo sitio se encolan en vez de pisarse.
concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Prerenderiza cada ruta a su propio index.html: no hay servidor Node
      # en produccion, solo archivos estaticos.
      - name: Build
        run: npm run build:landing

      # Workload Identity Federation: GitHub entrega un token OIDC de esta
      # ejecucion y Google lo cambia por credenciales de corta duracion de la
      # cuenta de despliegue. No hay llaves guardadas en el repo.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # firebase.json (target "landing") hace lo que hacian la funcion de
      # CloudFront y los metadatos de S3: las 301 de las URLs del sitio
      # anterior, /ruta servida desde /ruta/index.html, el HTML sin cache,
      # los bundles con hash cacheados un ano y 404.html (copia de la portada,
      # la genera el predeploy scripts/landing-404.mjs) con estado 404.
      # index.csr.html no se publica: es el esqueleto sin prerenderizar y
      # ninguna ruta lo referencia. Firebase publica la version completa de
      # una vez: las paginas que dejan de existir desaparecen y no hay cache
      # que invalidar.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting:landing --project avaltrust-prod --non-interactive
