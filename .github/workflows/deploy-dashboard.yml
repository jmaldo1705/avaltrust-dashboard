name: Deploy AvalTrust Dashboard to Firebase Hosting

on:
  push:
    branches: [master]
    # El workspace ya aloja dos aplicaciones: un cambio que solo toca la
    # landing no tiene por que redesplegar el dashboard.
    paths:
      - 'projects/dashboard/**'
      - 'projects/shared-ui/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch: {}

# Dos despliegues seguidos del mismo sitio se encolan en vez de pisarse.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Workload Identity Federation: GitHub entrega un token OIDC de esta
      # ejecucion y Google lo cambia por credenciales de corta duracion de la
      # cuenta de despliegue. No hay llaves guardadas en el repo.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # firebase.json (target "app") define la SPA: las rutas sin archivo
      # devuelven index.html con 200, los bundles con hash se cachean un ano
      # e index.html no se cachea. Firebase publica la version completa de
      # una vez, asi que no hay cache que invalidar.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting:app --project avaltrust-prod --non-interactive
