<header class="top-bar">
  <div class="top-bar-left">
    <button class="menu-toggle" type="button" (click)="onToggleSidebar()" aria-label="Abrir menu">
      <svg lucideMenu></svg>
    </button>

    <div class="brand-container">
      <img
        ngSrc="assets/images/logo.png"
        alt="AvalTrust"
        class="header-logo"
        width="449"
        height="142"
        priority>
    </div>
  </div>

  <div class="top-bar-center">
    <span class="system-pill">Financial and Fintech</span>
  </div>

  <div class="top-bar-right">
    @if (userProfile(); as profile) {
      <div class="user-menu">
        <button class="user-menu-trigger" type="button" (click)="onToggleUserMenu()" [class.open]="isUserMenuOpen">
          <span class="user-avatar">
            <svg lucideUserRound></svg>
          </span>
          <span class="user-summary">
            <span class="user-name">{{ profile.username }}</span>
            <span class="user-role-compact">{{ getUserRoleDisplay() }}</span>
          </span>
          <svg class="dropdown-arrow" lucideChevronDown></svg>
        </button>

        <div class="user-dropdown" [class.open]="isUserMenuOpen">
          <div class="user-info">
            <div class="user-avatar-large">
              <svg lucideCircleUserRound></svg>
            </div>
            <div class="user-details">
              <div class="username">{{ profile.username }}</div>
              <div class="user-role">{{ getUserRoleDisplay() }}</div>
              @if (profile.email) {
                <div class="user-email">{{ profile.email }}</div>
              }
            </div>
          </div>

          <div class="dropdown-divider"></div>

          <button class="dropdown-item" type="button" (click)="onNavigate('/user/profile')">
            <span class="item-icon"><svg lucideCircleUserRound></svg></span>
            Mi perfil
          </button>

          <button class="dropdown-item" type="button" (click)="onNavigate('/user/settings')">
            <span class="item-icon"><svg lucideSettings></svg></span>
            Configuracion
          </button>

          <div class="dropdown-divider"></div>

          <button class="dropdown-item logout-item" type="button" (click)="onLogout()">
            <span class="item-icon"><svg lucideLogOut></svg></span>
            Cerrar sesion
          </button>
        </div>
      </div>
    }
  </div>
</header>
